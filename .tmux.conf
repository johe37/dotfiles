# SET
set -g default-terminal "tmux-256color"
set -g prefix C-s
set -ga terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

set -g history-limit 50000
setw -g mode-keys vi
set -s escape-time 0
set -s set-clipboard on
set -g focus-events on
set -g allow-passthrough on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# BINDS
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind C-s send-prefix

unbind M
bind-key -T prefix m set -g mouse

bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window     -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind a last-window

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

bind g display-popup -E -w 80% -h 80% "~/.scripts/goto"
bind S setw synchronize-panes \; display "sync #{?pane_synchronized,on,off}"

# VSCODE DARK+ THEME COLORS
thm_bg="#1e1e1e"
thm_fg="#d4d4d4"
thm_accent="#007acc"
thm_sidebar="#252526"
thm_hover="#2a2d2e"
thm_sel="#094771"
thm_gray="#6e6e6e"
thm_green="#4ec9b0"
thm_yellow="#dcdcaa"
thm_red="#f14c4c"
thm_orange="#ce9178"
thm_purple="#c586c0"
thm_blue="#569cd6"

# STATUS BAR (Dark-focused)
set -g status-position bottom
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-fg "${thm_fg}"
set -g status-interval 5

set -g status-left-length 80
set -g status-right-length 150
set -g status-left "#[bg=${thm_blue},fg=${thm_bg}] ◆ #S #[bg=${thm_sidebar},fg=${thm_blue}]█ #[bg=${thm_bg},fg=${thm_fg}]"
set -g status-right "#{?client_prefix,#[bg=${thm_yellow} fg=${thm_bg} bold] PREFIX ,}#{?pane_synchronized,#[bg=${thm_red} fg=${thm_bg}] SYNC ,}#[fg=${thm_gray}]%H:%M  %d-%b-%Y "

# WINDOWS (VSCode-style tabs)
set -g window-status-separator ""
set -g status-justify left
setw -g window-status-format "#[fg=${thm_fg},bg=${thm_sidebar},nobold] #I:#W "
setw -g window-status-current-format "#[fg=${thm_bg},bg=#dcdcaa,bold] #I:#W "
setw -g window-status-activity-style "fg=${thm_yellow},bg=${thm_bg}"
setw -g window-status-bell-style "fg=${thm_bg},bg=${thm_red}"

# PANES (VSCode-style: visible borders with color coding)
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=${thm_accent},fg=${thm_bg}] ◆ #{pane_index} ,}"
set -g pane-border-lines single
set -g pane-border-style "fg=${thm_sidebar}"
set -g pane-active-border-style "fg=${thm_accent}"
set -g display-panes-colour "${thm_gray}"
set -g display-panes-active-colour "${thm_blue}"
set -g display-panes-time 2000

# COPY MODE & CHOOSER (Session/Window selector)
set -g mode-style "bg=${thm_blue} fg=${thm_bg}"

# MESSAGES
set -g message-style "bg=${thm_accent},fg=#ffffff"
set -g message-command-style "bg=${thm_accent},fg=#ffffff"

# AIRGAP SAFE: No external plugin dependencies
